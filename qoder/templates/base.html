<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}实验室周报助手{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2f6feb;
      --decision: #6f42c1;
      --decision-bg: #f3efff;
      --constraint: #b45309;
      --constraint-bg: #fef3c7;
      --progress: #15803d;
      --progress-bg: #e7f6ec;
      --next: #0e7490;
      --next-bg: #e0f2f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    code {
      font-family: "Cascadia Code", Consolas, "SFMono-Regular", monospace;
      font-size: 0.86em;
      background: #f3f4f6;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      word-break: break-all;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
    .top {
      background: #101828;
      color: #fff;
      margin-bottom: 26px;
    }
    .top .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
    .brand { color: #fff; text-decoration: none; font-weight: 600; letter-spacing: 0.02em; }
    .top nav a { color: #cbd5e1; text-decoration: none; margin-left: 20px; font-size: 14px; }
    .top nav a:hover { color: #fff; }
    h1 { font-size: 26px; margin: 0 0 6px; }
    h2 { font-size: 17px; margin: 0 0 10px; }
    .hero { margin-bottom: 18px; }
    .hero .sub { margin: 0 0 8px; color: #374151; }
    .hero .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
    .hero .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 14px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 22px;
      margin-bottom: 18px;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }
    .stats div {
      flex: 1 1 150px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
    }
    .stats b { display: block; font-size: 22px; line-height: 1.3; }
    .stats span { color: var(--muted); font-size: 12.5px; }
    .kind {
      display: inline-block;
      font-size: 12px;
      line-height: 18px;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
      vertical-align: 1px;
    }
    .kind.decision { color: var(--decision); background: var(--decision-bg); border-color: #e0d5ff; }
    .kind.constraint { color: var(--constraint); background: var(--constraint-bg); border-color: #fde68a; }
    .kind.progress { color: var(--progress); background: var(--progress-bg); border-color: #bbe7c8; }
    .kind.next-step { color: var(--next); background: var(--next-bg); border-color: #bae6f2; }
    .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .head .prep { color: var(--muted); font-size: 12.5px; }
    .items { margin: 8px 0 0; padding-left: 22px; }
    .items li { padding: 10px 0; border-top: 1px dashed var(--border); }
    .items li:first-child { border-top: none; }
    .items p { margin: 0 0 6px; }
    .ref { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
    .ref .q code { background: #fff; }
    .badge {
      display: inline-block;
      font-size: 11.5px;
      line-height: 18px;
      padding: 0 7px;
      border-radius: 999px;
      border: 1px solid #fdba74;
      background: #fff7ed;
      color: #9a3412;
    }
    .badge.src { border-color: var(--border); background: #f9fafb; color: #4b5563; }
    .score { font-size: 11.5px; color: #9ca3af; }
    .hits { list-style: none; margin: 0; padding: 0; }
    .hits li { padding: 10px 0; border-top: 1px dashed var(--border); }
    .hits li:first-child { border-top: none; }
    .hits p { margin: 4px 0 6px; }
    .topic { margin: 0; font-size: 16px; font-weight: 600; }
    .hint { margin: 4px 0 12px; color: var(--muted); font-size: 13px; }
    .note { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }
    .warn { color: var(--constraint); font-size: 12.5px; }
    .answer { font-size: 20px; font-weight: 700; color: #b42318; margin: 6px 0 10px; }
    .verdict ul { margin: 0; padding-left: 20px; }
    .verdict li { margin: 4px 0; }
    dl.kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 0; font-size: 13.5px; }
    dl.kv dt { color: var(--muted); }
    dl.kv dd { margin: 0; word-break: break-all; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; background: #fafafa; }
    td.ids code { display: inline-block; margin: 1px 3px 1px 0; font-size: 10.5px; }
    td.path code, td.q code { white-space: nowrap; word-break: keep-all; }
    td.q { white-space: nowrap; }
    .step { font-weight: 600; white-space: nowrap; }
    .muted { color: #9ca3af; }
    .foot { color: var(--muted); font-size: 12.5px; padding-top: 4px; padding-bottom: 30px; }
    .empty { color: var(--muted); }
    @media (max-width: 720px) {
      dl.kv { grid-template-columns: 1fr; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/">实验室周报助手</a>
      <nav>
        <a href="/">周报</a>
        <a href="/evidence">证据链</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap foot">
    <p>正文与 citation 全部取自 PowerContext 的 /v1/context/prepare 响应；模板只负责排版，未接入任何 LLM 润色。</p>
  </footer>
</body>
</html>
